<nav class="navbar">
  <div class="navbar-brand">
    @if (isEmpleado() && !isAdmin()) {
      <a routerLink="/validador">
        <span class="logo-text"><span class="neon">CINE</span>MARDO</span>
      </a>
    } @else {
      <a routerLink="/home">
        <span class="logo-text"><span class="neon">CINE</span>MARDO</span>
      </a>
    }
  </div>
  <div class="navbar-menu">
    @if (!isLoginPage() && (!isEmpleado() || isAdmin())) {
      <a routerLink="/home" routerLinkActive="active">Cartelera</a>
    }
    
    @if (isEmpleado()) {
      <a routerLink="/validador" routerLinkActive="active" style="color: var(--color-accent-warm);">Validador QR</a>
    }

    @if (isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Admin Panel</a>
    }
    
    <div class="user-actions">
      @if (isLoggedIn()) {
        @if (!isEmpleado() || isAdmin()) {
          <a routerLink="/profile" routerLinkActive="active">Mi Perfil</a>
        }
        <button class="btn btn-logout" (click)="logout()">Salir</button>
      } @else {
        <a routerLink="/login" class="btn btn-primary" style="padding: 8px 20px; font-size: 0.85rem;">Ingresar</a>
      }
    </div>
  </div>
</nav>
