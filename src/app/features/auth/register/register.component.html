<div class="auth-page">
  <div class="auth-background"></div>
  <div class="auth-container" style="max-width: 600px;">
    <div class="auth-card neon-card">
      <div class="auth-header text-center">
        <h2>
          <span class="neon-line-auth"></span> Registro
        </h2>
        <p class="subtitle text-muted">¡Unite y obtené beneficios en <span class="glow-primary-text" style="font-weight: 700;">Cine</span>mardo!</p>
      </div>

      @if (errorMessage) {
        <div class="alert alert-error">{{ errorMessage }}</div>
      }

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <div class="form-row flex-between" style="gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" type="text" formControlName="nombre" class="form-control" placeholder="Juan">
          </div>

          <div class="form-group" style="flex: 1;">
            <label for="apellido" class="form-label">Apellido</label>
            <input id="apellido" type="text" formControlName="apellido" class="form-control" placeholder="Pérez">
          </div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input id="email" type="email" formControlName="email" class="form-control" placeholder="tu@email.com">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" formControlName="password" class="form-control" placeholder="••••••••">
        </div>

        <div class="form-row flex-between" style="gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="fechaNacimiento" class="form-label">Nacimiento</label>
            <input id="fechaNacimiento" type="date" formControlName="fechaNacimiento" class="form-control">
          </div>

          <div class="form-group" style="flex: 1;">
            <label for="diasVacaciones" class="form-label">Días Vacaciones/Año</label>
            <input id="diasVacaciones" type="number" formControlName="diasVacaciones" class="form-control" placeholder="14">
          </div>
        </div>

        <div class="form-row flex-between" style="gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="tipoSangre" class="form-label">Grupo Sanguíneo</label>
            <select id="tipoSangre" formControlName="tipoSangre" class="form-control" style="appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill=%22white%22 height=%2224%22 viewBox=%220 0 24 24%22 width=%2224%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M7 10l5 5 5-5z%22/><path d=%22M0 0h24v24H0z%22 fill=%22none%22/></svg>'); background-repeat: no-repeat; background-position: right 10px center;">
              <option value="">Seleccionar...</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>

          <div class="form-group" style="flex: 1;">
            <label for="colorOjos" class="form-label">Color Ojos</label>
            <select id="colorOjos" formControlName="colorOjos" class="form-control" style="appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill=%22white%22 height=%2224%22 viewBox=%220 0 24 24%22 width=%2224%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M7 10l5 5 5-5z%22/><path d=%22M0 0h24v24H0z%22 fill=%22none%22/></svg>'); background-repeat: no-repeat; background-position: right 10px center;">
              <option value="">Seleccionar...</option>
              <option value="Marrones">Marrones</option>
              <option value="Azules">Azules</option>
              <option value="Verdes">Verdes</option>
              <option value="Miel">Miel</option>
              <option value="Negros">Negros</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
        </div>

        <div class="auth-actions" style="margin-top: 15px;">
          <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
            {{ loading ? 'Creando cuenta...' : 'Registrarme' }}
          </button>
        </div>
      </form>

      <div class="auth-links text-center">
        <p class="text-muted">¿Ya tenés cuenta? <a routerLink="/login" class="text-accent">Iniciá sesión</a></p>
      </div>
    </div>
  </div>
</div>
