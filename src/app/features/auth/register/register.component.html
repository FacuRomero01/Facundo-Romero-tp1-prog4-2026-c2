<div class="auth-container">
  <div class="auth-card register-card">
    <h2>Crear Cuenta</h2>
    <p class="subtitle">¡Registrate y obtené un 20% de descuento en tu primera compra!</p>

    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="form-row">
        <div class="form-group half">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" formControlName="nombre" class="form-control" placeholder="Juan">
        </div>

        <div class="form-group half">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" formControlName="apellido" class="form-control" placeholder="Pérez">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" class="form-control" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" class="form-control" placeholder="••••••••">
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="fechaNacimiento">Fecha de Nacimiento</label>
          <input id="fechaNacimiento" type="date" formControlName="fechaNacimiento" class="form-control">
        </div>

        <div class="form-group half">
          <label for="diasVacaciones">Días de vacaciones / año</label>
          <input id="diasVacaciones" type="number" formControlName="diasVacaciones" class="form-control">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="tipoSangre">Tipo de Sangre</label>
          <select id="tipoSangre" formControlName="tipoSangre" class="form-control">
            <option value="">Seleccionar...</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>

        <div class="form-group half">
          <label for="colorOjos">Color de Ojos</label>
          <select id="colorOjos" formControlName="colorOjos" class="form-control">
            <option value="">Seleccionar...</option>
            <option value="Marrones">Marrones</option>
            <option value="Azules">Azules</option>
            <option value="Verdes">Verdes</option>
            <option value="Miel">Miel</option>
            <option value="Negros">Negros</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-primary w-100" [disabled]="registerForm.invalid || loading">
        {{ loading ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    </form>

    <div class="auth-links">
      <p>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
    </div>
  </div>
</div>
