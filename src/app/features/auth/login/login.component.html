<div class="auth-page">
  <div class="auth-background"></div>
  <div class="auth-container">
    <div class="auth-card neon-card">
      <div class="auth-header text-center">
        <h2>
          <span class="neon-line-auth"></span> Acceso
        </h2>
        <p class="subtitle text-muted">Bienvenido a <span class="glow-primary-text" style="font-weight: 700;">Cine</span>mardo</p>
      </div>

      @if (errorMessage) {
        <div class="alert alert-error">{{ errorMessage }}</div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input id="email" type="email" formControlName="email" class="form-control" placeholder="tu@email.com">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" formControlName="password" class="form-control" placeholder="••••••••">
        </div>

        <div class="auth-actions">
          <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || loading">
            {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
          </button>
          
          <button type="button" class="btn btn-secondary w-100" routerLink="/home">
            Ingresar como Invitado
          </button>
        </div>
      </form>

      <div class="quick-access mt-4 text-center">
        <p class="text-muted mb-2" style="font-size: 0.9rem;">Acceso Rápido:</p>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
          <button type="button" class="btn btn-sm btn-outline-primary" style="margin: 5px;" (click)="autoFill('admin@gmail.com', '111111')">Admin</button>
          <button type="button" class="btn btn-sm btn-outline-primary" style="margin: 5px;" (click)="autoFill('empleado@gmail.com', '111111')">Empleado</button>
          <button type="button" class="btn btn-sm btn-outline-primary" style="margin: 5px;" (click)="autoFill('cliente@gmail.com', '111111')">Cliente</button>
          <button type="button" class="btn btn-sm btn-outline-primary" style="margin: 5px;" (click)="autoFill('cliente10anos@gmail.com', '111111')">Cliente < 18</button>
          <button type="button" class="btn btn-sm btn-outline-primary" style="margin: 5px;" (click)="autoFill('cliente50@gmail.com', '111111')">Cliente > 50</button>
        </div>
      </div>

      <div class="auth-links text-center mt-3">
        <p class="text-muted">¿No tenés cuenta? <a routerLink="/register" class="text-accent">Registrate acá</a></p>
      </div>
    </div>
  </div>
</div>
