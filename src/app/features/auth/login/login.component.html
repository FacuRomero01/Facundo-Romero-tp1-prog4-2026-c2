<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Bienvenido nuevamente al CineStar</p>

    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" class="form-control" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary w-100" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
      
      <button type="button" class="btn-secondary w-100" style="margin-top: 1rem;" routerLink="/home">
        Ingresar sin registrarse (Invitado)
      </button>
    </form>

    <div class="auth-links">
      <p>¿No tenés cuenta? <a routerLink="/register">Registrate acá</a></p>
    </div>
  </div>
</div>
