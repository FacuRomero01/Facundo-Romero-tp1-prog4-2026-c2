<div class="seat-map-container">
  
  <div class="screen-indicator">
    <div class="screen-glow"></div>
    <div class="screen-text">PANTALLA</div>
  </div>

  <div class="seats-wrapper">
    <div class="seats-grid">
      @for (row of bookingService.rows; track row) {
        <div class="seat-row">
          <span class="row-label">{{ row }}</span>
          
          <div class="row-seats">
            @for (seat of bookingService.seats(); track seat.id) {
              @if (seat.row === row) {
                <div 
                  class="seat" 
                  [class.aisle-right]="(seat.type === 'accessible' && (seat.col === 2 || seat.col === 12)) || (seat.type !== 'accessible' && (seat.col === 4 || seat.col === 24))"
                  [ngClass]="[seat.status, seat.type]"
                  (click)="toggleSeat(seat)"
                  [title]="'Fila ' + seat.row + ' Columna ' + seat.col + ' - ' + (seat.type === 'vip' ? 'VIP' : (seat.type === 'accessible' ? 'Accesible' : 'Estándar'))">
                  @if (seat.status === 'selected') {
                    <span class="seat-number">{{ seat.col }}</span>
                  }
                </div>
              }
            }
          </div>
          
          <span class="row-label right">{{ row }}</span>
        </div>
      }
    </div>
  </div>

  <div class="leyenda">
    <div class="legend-item"><div class="seat-demo available"></div> <span>Disponible</span></div>
    <div class="legend-item"><div class="seat-demo selected"></div> <span>Seleccionado</span></div>
    <div class="legend-item"><div class="seat-demo occupied"></div> <span>Ocupado</span></div>
    <div class="legend-item"><div class="seat-demo vip available"></div> <span>VIP</span></div>
    <div class="legend-item"><div class="seat-demo accessible available"></div> <span>Accesible</span></div>
  </div>
</div>
